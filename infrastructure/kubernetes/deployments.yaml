apiVersion: v1
kind: Namespace
metadata:
  name: zerotrustx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ztx-control-plane
  namespace: zerotrustx
  labels:
    app: ztx-control-plane
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ztx-control-plane
  template:
    metadata:
      labels:
        app: ztx-control-plane
    spec:
      containers:
      - name: control-plane
        image: zerotrustx/control-plane:1.0.0
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ztx-secrets
              key: database-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ztx-secrets
              key: jwt-secret
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ztx-control-plane-svc
  namespace: zerotrustx
spec:
  type: ClusterIP
  selector:
    app: ztx-control-plane
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ztx-default-deny-ingress
  namespace: zerotrustx
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ztx-web-console
    ports:
    - protocol: TCP
      port: 8000
